[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-engineering-lab"
version = "0.1.0"
description = "Python, ML, PyTorch, LLM을 한국어로 학습하는 AI 논문 재현 프로젝트"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
rag = [
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
]
openai = [
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
  "langchain-openai>=1,<2",
]
lab = [
  "jupyterlab>=4.4,<5",
  "ipykernel>=6.29,<8",
  "ipywidgets>=8.1,<9",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
]
all = [
  "streamlit>=1.40,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "jupyterlab>=4.4,<5",
  "ipykernel>=6.29,<8",
  "ipywidgets>=8.1,<9",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
