name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_LAB_DEVICE: cpu
  AI_LAB_CPU_THREADS: "2"
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python 3.12 / tests and notebook contracts
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install Windows learning environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --requirement requirements-windows.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --editable . --no-deps
          python -m pip check

      - name: Lint Python sources
        run: python -m ruff check app.py scripts src tests tools projects

      - name: Run unit tests
        run: python -m pytest

      - name: Validate notebook structure and pair contracts
        shell: pwsh
        run: |
          python tools/validate_all_notebooks.py
          python tools/validate_paired_notebooks.py
          python tools/validate_paper_reproductions.py
          python tools/validate_field_reproductions.py
          python tools/validate_portfolio_quality.py
          python tools/validate_api_explanations.py
          python tools/apply_api_explanations.py --check

      - name: Verify generated paper notebooks are current
        shell: pwsh
        run: |
          python tools/build_paper_reproductions.py
          python tools/build_field_reproductions.py

          $generatedChanges = @(
            git status --porcelain --untracked-files=all -- `
              notebooks/paper_reproductions `
              notebooks/field_reproductions
          )
          if ($LASTEXITCODE -ne 0) {
            throw "git status failed while checking generated notebooks"
          }
          if ($generatedChanges.Count -gt 0) {
            Write-Host "::error::Generated notebooks differ from their source specifications. Run the builders and commit the results."
            $generatedChanges | ForEach-Object { Write-Host $_ }
            git diff --stat -- notebooks/paper_reproductions notebooks/field_reproductions
            exit 1
          }
